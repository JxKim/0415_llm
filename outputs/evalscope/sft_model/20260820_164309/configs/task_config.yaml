  prompt_template: '你是一个汽车售后客服回复质量评测裁判。不要输出分析过程。

    请判断模型回复的效果。最终输出一个分数。

    最终只输出一个分数，格式必须为 [[0到1之间的小数]]，例如 [[0.8]]


    评分标准：

    1、格式规范：回复结构完整、要素齐全（如故障诊断需含紧急程度判断与建议、投诉处理需含共情/补救/升级路径），权重：0.3

    2、信息准确：政策/价格/安全判断正确（涉及行车安全的分级判断错误直接给低分），权重：0.4

    3、语气与共情：礼貌、专业、不推诿，权重：0.2

    4、方案可执行：给出明确后续动作（到店检测/预约/拖车/留联系方式等），权重：0.1

    最终将结果限制到0-1的范围


    [题目]

    {question}


    [模型输出]

    {pred}


    输出一个最终的0-1的分数'
  score_pattern: \[\[(\d+(?:\.\d+)?)\]\]
  score_type: numeric
